# Security gate (360 standard, 2026-11-15). Runs on every PR, on main, and weekly so new advisories surface.
# Free tools only. Actions are pinned to commit SHAs; Dependabot keeps them current.
name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read # gitleaks reads the PR's commit range
jobs:
  dependency-audit:
    # Fails on a high or critical advisory in a package the running app loads (dev tools are not shipped).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
